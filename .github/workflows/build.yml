name: SeanPak CI & Release Builder

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build SeanPak (${{ matrix.target }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            name: seanpak-x86_64-windows

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Test overlay reading and extraction
        shell: bash
        run: cargo test --lib authenticode --target ${{ matrix.target }}

      - name: Test high-contrast palette roles
        shell: bash
        run: cargo test --lib high_contrast_fill_roles --target ${{ matrix.target }}

      - name: Test init-generated packaging commands
        shell: bash
        run: cargo test --lib init_ --target ${{ matrix.target }}

      - name: Validate release signing script without credentials
        shell: pwsh
        env:
          SEANPAK_CODESIGN_CERT_BASE64: ""
          SEANPAK_CODESIGN_CERT_PASSWORD: ""
        run: .github/scripts/sign-release.ps1 -Path unused.exe

      - name: Build SFX Stub
        shell: bash
        run: |
          if [ -d "sfx_stub" ]; then
            cd sfx_stub
            RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target ${{ matrix.target }}
            cd ..
          fi

      - name: Build SeanPak Executable
        shell: bash
        run: |
          RUSTFLAGS="-C target-feature=+crt-static" cargo build --release --target ${{ matrix.target }}

      - name: Test MSBuild package integration
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "SeanPak MSBuild smoke"
          $files = Join-Path $smokeRoot "files"
          $tools = Join-Path $smokeRoot "tools"
          $output = Join-Path $smokeRoot "dist"
          New-Item -ItemType Directory -Force -Path $files, $tools, $output | Out-Null
          [IO.File]::WriteAllText((Join-Path $files "smoke.exe"), "fixture payload")
          $cli = Join-Path $tools "SeanPak CLI.exe"
          Copy-Item "target/x86_64-pc-windows-msvc/release/seanpak.exe" $cli
          & $cli init $smokeRoot --name "MSBuild Smoke"
          if ($LASTEXITCODE -ne 0) { throw "SeanPak init failed with exit code $LASTEXITCODE" }

          $targetFile = Join-Path $env:GITHUB_WORKSPACE "msbuild/SeanPak.targets"
          $manifest = Join-Path $smokeRoot "manifest.json"
          $publishDir = $files + [IO.Path]::DirectorySeparatorChar
          $project = Join-Path $smokeRoot "MSBuildSmoke.proj"
          $xml = @'
          <Project DefaultTargets="Publish">
            <PropertyGroup>
              <PublishDir>__PUBLISH__</PublishDir>
              <SeanPakEnabled>true</SeanPakEnabled>
              <SeanPakExecutable>__CLI__</SeanPakExecutable>
              <SeanPakManifest>__MANIFEST__</SeanPakManifest>
              <SeanPakOutputDirectory>__OUTPUT__</SeanPakOutputDirectory>
            </PropertyGroup>
            <Target Name="Publish">
              <Message Importance="high" Text="MSBuild publish fixture is ready." />
            </Target>
            <Import Project="__TARGETS__" />
          </Project>
          '@
          $xml = $xml.Replace('__PUBLISH__', [System.Security.SecurityElement]::Escape($publishDir))
          $xml = $xml.Replace('__CLI__', [System.Security.SecurityElement]::Escape($cli))
          $xml = $xml.Replace('__MANIFEST__', [System.Security.SecurityElement]::Escape($manifest))
          $xml = $xml.Replace('__OUTPUT__', [System.Security.SecurityElement]::Escape($output))
          $xml = $xml.Replace('__TARGETS__', [System.Security.SecurityElement]::Escape($targetFile))
          [IO.File]::WriteAllText($project, $xml, [Text.UTF8Encoding]::new($false))
          dotnet msbuild $project -target:Publish -nologo -verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "MSBuild target failed with exit code $LASTEXITCODE" }
          if (-not (Get-ChildItem -LiteralPath $output -Filter "*-Setup.exe" -File)) { throw "MSBuild did not produce a Setup.exe" }
          if (-not (Get-ChildItem -LiteralPath $output -Filter "*-Portable.zip" -File)) { throw "MSBuild did not produce a Portable ZIP" }
          if (-not (Test-Path (Join-Path $output "SHA256SUMS.txt"))) { throw "MSBuild did not produce SHA256SUMS.txt" }

      # Stub-size budget: the installer stub is the binary every packaged
      # app ships, so it stays lean. Measured Slice 2 stubs: 635,904
      # bytes (Windows PE, gnu-linked) and 607,384 bytes (host release);
      # the MSVC CI build is the same code and profile class. The budget
      # is 4 MiB — several times the measured size, far under the 15 MB
      # blueprint ceiling, and tight enough to fail loudly if a heavy
      # runtime ever sneaks in.
      - name: Stub size budget (x86_64 stub)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          size=$(stat -c %s target/x86_64-pc-windows-msvc/release/seanpak.exe)
          budget=4194304
          echo "Stub size: $size bytes (budget: $budget bytes / 4 MiB)"
          if [ "$size" -gt "$budget" ]; then
            echo "::error::SeanPak stub is $size bytes, over the 4 MiB budget ($budget)."
            exit 1
          fi

      # Golden-package sandbox proof on the real Windows build: pack the
      # fixture, then `verify --sandbox` silently installs it, compares
      # every file byte-for-byte, silently uninstalls, and asserts no
      # residue — the same fixture the host test suite uses.
      - name: Golden package sandbox verify
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: bash
        run: |
          SP=target/x86_64-pc-windows-msvc/release/seanpak.exe
          mkdir -p golden/files/data golden/out
          awk 'BEGIN{for(i=0;i<200;i++) print "golden fixture exe bytes aaaaaaaa"}' > golden/files/golden.exe
          awk 'BEGIN{for(i=0;i<5000;i++) print "golden fixture line bbbbbbbb"}' > golden/files/data/big.txt
          printf 'golden readme\n' > golden/files/readme.txt
          cat > golden/manifest.json <<'EOF'
          {"appName":"GoldenApp","version":"1.0.0","publisher":"SeanPak CI","primaryExe":"golden.exe","desktopShortcut":true,"startMenuShortcut":true,"fileAssociations":[".gold"],"pathEntry":false}
          EOF
          "$SP" pack golden/manifest.json golden/files --out-dir golden/out --json
          "$SP" verify golden/out/GoldenApp-v1.0.0-x64-Setup.exe --sandbox --json

      - name: Prepare Binary Artifacts
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/seanpak.exe dist/${{ matrix.name }}.exe
          cp README.md dist/
          cp app.manifest dist/
          cd dist
          7z a ../${{ matrix.name }}.zip *
          cd ..

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/${{ matrix.name }}.exe
            ${{ matrix.name }}.zip
          retention-days: 90

  publish-release:
    name: Publish Release Assets
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      # SeanPak packages itself: the just-built x64 executable packs the
      # standard release set from packaging/seanpak-manifest.json (the
      # version is stamped from the tag), proves it with the sandbox
      # verify, and only then do the three assets attach to the release.
      - name: Pack SeanPak with itself
        shell: bash
        env:
          SEANPAK_CODESIGN_CERT_BASE64: ${{ secrets.SEANPAK_CODESIGN_CERT_BASE64 }}
          SEANPAK_CODESIGN_CERT_PASSWORD: ${{ secrets.SEANPAK_CODESIGN_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          ver="${GITHUB_REF_NAME#v}"
          mkdir -p selfpack/files release-assets
          ls -R artifacts
          cp artifacts/seanpak-x86_64-windows/dist/seanpak-x86_64-windows.exe selfpack/files/seanpak.exe
          cp README.md LICENSE selfpack/files/
          sed -i "s/\"version\": *\"[^\"]*\"/\"version\": \"$ver\"/" packaging/seanpak-manifest.json
          # Run the tool from OUTSIDE the payload dir: seanpak writes its
          # seanpak.log beside its own exe, and a tool copy inside the
          # files dir would pack that log into the release (v4.5.0 did).
          cp selfpack/files/seanpak.exe ./seanpak-tool.exe
          # Sign the portable payload only; keep the packer stub unsigned until
          # its overlay is complete, then sign the finished Setup.exe below.
          pwsh -NoProfile -File .github/scripts/sign-release.ps1 -Path selfpack/files/seanpak.exe
          SP=./seanpak-tool.exe
          "$SP" pack packaging/seanpak-manifest.json selfpack/files --out-dir release-assets --json
          pwsh -NoProfile -File .github/scripts/sign-release.ps1 -Path "release-assets/SeanPak-v$ver-x64-Setup.exe" -ChecksumDirectory release-assets
          "$SP" verify "release-assets/SeanPak-v$ver-x64-Setup.exe" --sandbox --json
          ls -la release-assets
      - name: Attach assets to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/SeanPak-*-x64-Setup.exe
            release-assets/SeanPak-*-x64-Portable.zip
            release-assets/SHA256SUMS.txt
