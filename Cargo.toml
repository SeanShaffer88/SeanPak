[package]
name = "seanpak"
version = "5.1.0"
edition = "2021"
authors = ["SeanPak Systems Engineering Team"]
description = "SeanPak: Zero-dependency, high-throughput standalone Windows installer packager and PE overlay engine"
license = "MIT"
repository = "https://github.com/SeanShaffer88/SeanPak"
readme = "README.md"
keywords = ["installer", "packager", "windows", "pe-overlay", "win32"]

[lib]
name = "seanpak"
path = "src/lib.rs"

[[bin]]
name = "seanpak"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.59", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Storage_Compression",
    "Win32_System_IO",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_RestartManager",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Graphics_Gdi"
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
